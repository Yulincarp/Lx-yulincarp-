name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test tests/Lx.Tests/Lx.Tests.csproj -c Release --nologo
      - name: Build
        run: dotnet build Lx.sln -c Release --nologo
